---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: almalinux10
    box: almalinux/10-kitten-x86_64_v2
    memory: 2048
    cpus: 1
  - name: resolute
    box: bento/ubuntu-26.04
    memory: 1024
    cpus: 1
    provider_raw_config_args:
      - customize ["modifyvm", :id, "--cableconnected1", "on"]
      - customize ['modifyvm', :id, '--uart1', '0x3F8', '4']
      - customize ['modifyvm', :id, '--uartmode1', 'file', File::NULL]
  - name: trixie
    box: bento/debian-13
    memory: 1024
    cpus: 1
provisioner:
  name: ansible
  playbooks:
    converge: "../resources/converge.yml"
    verify: "../resources/verify.yml"
  config_options:
    defaults:
      callback_whitelist: profile_tasks
      interpreter_python: auto_silent
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  log: true
  inventory:
    host_vars:
      almalinux:
      resolute:
      trixie:
verifier:
  name: ansible
scenario:
  name: default
  create_sequence:
    - dependency
    - create
    - prepare
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
