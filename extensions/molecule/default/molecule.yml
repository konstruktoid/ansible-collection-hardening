---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: almalinux10
    image_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
    ssh_user: almalinux
    ssh_user_group: wheel
    ssh_port: 22201
    memory: 2048
    cpus: 1
  - name: resolute
    image_url: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img"
    ssh_user: ubuntu
    ssh_user_group: sudo
    ssh_port: 22202
    memory: 1024
    cpus: 1
  - name: trixie
    image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
    ssh_user: debian
    ssh_user_group: sudo
    ssh_port: 22203
    memory: 1024
    cpus: 1
provisioner:
  name: ansible
  playbooks:
    create: "../resources/create_qemu.yml"
    destroy: "../resources/destroy_qemu.yml"
    converge: "../resources/converge.yml"
    prepare: "../resources/prepare.yml"
    verify: "../resources/verify.yml"
  config_options:
    defaults:
      callback_whitelist: profile_tasks
      interpreter_python: auto_silent
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  log: true
  inventory:
    group_vars:
      molecule:
        ansible_become: true
    host_vars:
      almalinux10:
      resolute:
      trixie:
verifier:
  name: ansible
scenario:
  name: default
  create_sequence:
    - dependency
    - create
    - prepare
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
