---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: kitten10
    image_url: "https://kitten.repo.almalinux.org/10-kitten/cloud/x86_64/images/AlmaLinux-Kitten-GenericCloud-10-latest.x86_64.qcow2"
    image_force: true
    ssh_user: almalinux
    ssh_user_group: wheel
    ssh_port: 22301
    memory: 2048
    cpus: 2
  - name: stonking
    image_url: "https://cloud-images.ubuntu.com/stonking/current/stonking-server-cloudimg-amd64.img"
    image_force: true
    ssh_user: ubuntu
    ssh_user_group: sudo
    ssh_port: 22302
    memory: 1024
    cpus: 2
  - name: forky
    image_url: "https://cloud.debian.org/images/cloud/forky/daily/latest/debian-14-generic-amd64-daily.qcow2"
    image_force: true
    ssh_user: debian
    ssh_user_group: sudo
    ssh_port: 22303
    memory: 1024
    cpus: 2
provisioner:
  name: ansible
  playbooks:
    create: "../resources/create_qemu.yml"
    destroy: "../resources/destroy_qemu.yml"
    converge: "../resources/converge.yml"
    prepare: "../resources/prepare.yml"
    verify: "../resources/verify.yml"
  config_options:
    defaults:
      callbacks_enabled: "ansible.posix.profile_tasks,community.general.log_plays"
      # The plays run with strategy free, so hosts no longer report in step.
      # Drop the skipped hosts from the terminal, they are the bulk of the
      # interleaved noise, and keep a readable per host transcript on disk.
      display_skipped_hosts: false
      interpreter_python: "auto_silent"
    callback_log_plays:
      log_folder: "${MOLECULE_PROJECT_DIRECTORY}/molecule-logs/${MOLECULE_SCENARIO_NAME}"
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  log: true
  inventory:
    group_vars:
      molecule:
        ansible_become: true
        # AlmaLinux Kitten and the Ubuntu development release publish packages
        # continuously, so an upgrade between the two converges makes the
        # idempotence check fail on the archive instead of on a role. The
        # docker and default scenarios still cover the upgrade path.
        molecule_system_upgrade: false
    host_vars:
      kitten10:
      stonking:
      forky:
verifier:
  name: ansible
scenario:
  name: prerelease
  create_sequence:
    - dependency
    - create
    - prepare
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
