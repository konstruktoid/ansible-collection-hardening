---
- name: Prepare
  hosts: molecule
  # Same reason as the converge play: the hosts do package manager
  # specific work, so lock-step execution just makes them wait on each other.
  strategy: free
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install Python 3
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y python3 python3-apt || \
        dnf install -y python3 python3-dnf || microdnf install -y python3 python3-dnf
      changed_when: false

    - name: Install sudo
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y sudo || \
        microdnf install -y sudo || dnf install -y sudo
      changed_when: false

    - name: Gather facts
      ansible.builtin.gather_facts:

    - name: Install epel-release on the RedHat family
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present
        update_cache: true
      when:
        - ansible_facts.os_family == "RedHat"
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
