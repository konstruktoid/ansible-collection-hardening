---
- name: Prepare
  hosts: molecule
  # Same reason as the converge play: the hosts do package manager
  # specific work, so lock-step execution just makes them wait on each other.
  strategy: free
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install Python 3
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y python3 python3-apt || \
        dnf install -y python3 python3-dnf || microdnf install -y python3 python3-dnf
      changed_when: false

    - name: Install sudo
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y sudo || \
        microdnf install -y sudo || dnf install -y sudo
      changed_when: false

    - name: Gather facts
      ansible.builtin.gather_facts:

    - name: Install epel-release on the RedHat family
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present
        update_cache: true
      when:
        - ansible_facts.os_family == "RedHat"
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

    - name: Install compilers for the compilers role to restrict
      become: true
      ansible.builtin.package:
        name:
          - binutils
          - gcc
          - make
        state: present

    - name: Create the snapd directory for the compilers role snap fixture
      become: true
      ansible.builtin.file:
        path: /usr/lib/snapd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create a stand-in for the snap launcher
      become: true
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exit 0
        dest: /usr/lib/snapd/snap-fixture
        owner: root
        group: root
        mode: "0755"

    - name: Create compiler-named symlinks to the snap stand-in and to a missing file
      become: true
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: true
      loop:
        - { src: /usr/lib/snapd/snap-fixture, dest: /usr/local/bin/cc-99 }
        - { src: /nonexistent/compiler-fixture, dest: /usr/local/bin/cc-98 }
