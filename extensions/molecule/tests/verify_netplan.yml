---
- name: Verify netplan files permissions
  become: true
  block:
    - name: Check if netplan directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/netplan
        - /lib/netplan
        - /run/netplan
      register: netplan_dirs

    - name: Set netplan existing directories
      ansible.builtin.set_fact:
        netplan_existing_dirs: >-
          {{ netplan_dirs.results
             | selectattr('stat.exists')
             | map(attribute='item')
             | list }}

    - name: Find all netplan configuration files
      when: netplan_existing_dirs | length > 0
      ansible.builtin.find:
        paths: "{{ netplan_existing_dirs }}"
        recurse: true
        patterns:
          - "*.yaml"
          - "*.yml"
      register: netplan_configuration

    - name: Gather netplan files metadata
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ netplan_configuration.files | default([]) }}"
      register: netplan_configuration_stats

    - name: Assert netplan files permissions and ownership
      ansible.builtin.assert:
        that:
          - item.stat.mode == "0600"
          - item.stat.pw_name == "root"
          - item.stat.gr_name == "root"
        success_msg: >-
          {{ item.stat.path }} has correct permissions and ownership:
          {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }}
        fail_msg: >-
          {{ item.stat.path }} permissions or ownership are incorrect:
          {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }}
      loop: "{{ netplan_configuration_stats.results }}"

- name: Verify netplan-generated networkd file permissions with umask 0077
  become: false
  when:
    - ansible_facts.distribution == "Ubuntu"
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
  block:
    - name: Check netplan command exists
      ansible.builtin.stat:
        path: "/usr/sbin/netplan"
      register: "netplan_command"

    - name: Generate networkd configuration through sudo with umask 0077
      ansible.builtin.shell:
        cmd: |
          umask 0077
          /usr/bin/sudo -n /usr/sbin/netplan generate
        executable: "/bin/bash"
      changed_when: false
      when:
        - netplan_command.stat.exists

    - name: Find generated netplan networkd files
      ansible.builtin.find:
        paths: "/run/systemd/network"
        file_type: "file"
        patterns: "10-netplan-*.network"
      register: "netplan_networkd_files"
      when:
        - netplan_command.stat.exists

    - name: Assert generated netplan networkd files exist
      ansible.builtin.assert:
        that:
          - "netplan_networkd_files.matched | int > 0"
        fail_msg: >-
          Netplan did not generate a networkd configuration file after being
          invoked with umask 0077.
      when:
        - netplan_command.stat.exists

    - name: Gather generated netplan networkd file metadata
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ netplan_networkd_files.files | default([]) }}"
      register: "netplan_networkd_file_stats"
      when:
        - netplan_command.stat.exists

    - name: Assert generated netplan networkd files are readable by systemd-network
      ansible.builtin.assert:
        that:
          - "item.stat.mode == '0640'"
          - "item.stat.pw_name == 'root'"
          - "item.stat.gr_name == 'systemd-network'"
        fail_msg: >-
          Netplan-generated networkd files must be mode 0640 and owned by
          root:systemd-network when netplan is invoked with umask 0077.
      loop: "{{ netplan_networkd_file_stats.results | default([]) }}"
      when:
        - netplan_command.stat.exists
