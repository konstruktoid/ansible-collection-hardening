---
- name: Verify apt hardening configuration
  when:
    - ansible_facts.os_family == "Debian"
  block:
    - name: Stat apt hardening configuration file
      become: true
      ansible.builtin.stat:
        path: /etc/apt/apt.conf.d/99-hardening
      register: package_management_apt_hardening_configuration

    - name: Assert apt hardening configuration file exists
      ansible.builtin.assert:
        that:
          - package_management_apt_hardening_configuration.stat.exists
          - package_management_apt_hardening_configuration.stat.mode == "0644"

    - name: Verify apt hardening settings
      become: true
      ansible.builtin.shell:
        cmd: grep -Fx '{{ item }}' /etc/apt/apt.conf.d/99-hardening
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - 'Acquire::AllowDowngradeToInsecureRepositories "0";'
        - 'Acquire::AllowInsecureRepositories "0";'
        - 'Acquire::AllowWeakRepositories "0";'
        - 'Acquire::Check-Date "true";'
        - 'Acquire::http::AllowRedirect "false";'
        - 'APT::Get::AllowUnauthenticated "false";'
        - 'APT::Get::AutomaticRemove "true";'
        - 'APT::Install-Recommends "0";'
        - 'APT::Install-Suggests "0";'
        - 'APT::Periodic::AutocleanInterval "7";'
        - 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
        - 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'

    - name: Verify apt seccomp sandboxing is enabled
      become: true
      ansible.builtin.shell:
        cmd: grep -Fx 'APT::Sandbox::Seccomp "1";' /etc/apt/apt.conf.d/99-hardening
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - ansible_facts.distribution_release != "trixie"

    - name: Verify apt seccomp sandboxing is disabled on trixie
      become: true
      ansible.builtin.shell:
        cmd: grep -Fxc 'APT::Sandbox::Seccomp "1";' /etc/apt/apt.conf.d/99-hardening
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: package_management_trixie_seccomp.stdout | trim != "0"
      register: package_management_trixie_seccomp
      when:
        - ansible_facts.distribution_release == "trixie"

    - name: Get apt-config dump
      become: true
      ansible.builtin.command:
        cmd: apt-config dump
      changed_when: false
      register: package_management_apt_config_dump

    # CIS Debian 13 v1.1.0 and CIS Ubuntu 26.04 v1.0.0 1.2.1.12 - 1.2.1.15 audit
    - name: Assert CIS audited apt options are present in apt-config dump
      ansible.builtin.assert:
        that:
          - item in package_management_apt_config_dump.stdout_lines
        fail_msg: "{{ item }} is missing from the apt-config dump output"
      loop:
        - 'Acquire::AllowInsecureRepositories "0";'
        - 'Acquire::AllowWeakRepositories "0";'
        - 'Acquire::AllowDowngradeToInsecureRepositories "0";'
        - 'Acquire::Check-Date "true";'

    - name: Assert apt options with a built-in default are present in apt-config dump
      ansible.builtin.assert:
        that:
          - item in package_management_apt_config_dump.stdout_lines
        fail_msg: "{{ item }} is missing from the apt-config dump output"
      loop:
        - 'APT::Install-Recommends "0";'
        - 'APT::Install-Suggests "0";'

- name: Stat yum.conf
  when:
    - ansible_facts.os_family == "RedHat"
  ansible.builtin.stat:
    path: /etc/yum.conf
  register: yum_conf

- name: Verify yum.conf hardening settings
  become: true
  ansible.builtin.shell:
    cmd: grep -oE '^{{ item }}' /etc/yum.conf
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - ansible_facts.os_family == "RedHat"
    - yum_conf.stat.exists
  loop:
    - "gpgcheck=1"
    - "localpkg_gpgcheck=1"
    - "repo_gpgcheck=1"
    - "clean_requirements_on_remove=1"
