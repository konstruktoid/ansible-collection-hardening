---
- name: Read /etc/hosts.allow
  ansible.builtin.command:
    cmd: grep -vE '^#|^$' /etc/hosts.allow
  register: hosts_allow
  changed_when: false

- name: Assert hosts.allow entries
  ansible.builtin.assert:
    that:
      - "'sshd: ALL : ALLOW' in hosts_allow.stdout"
      - "'ALL: LOCAL, 127.0.0.1, [::1]' in hosts_allow.stdout"

- name: Read /etc/hosts.deny
  ansible.builtin.command:
    cmd: grep -vE '^#|^$' /etc/hosts.deny
  register: hosts_deny
  changed_when: false

- name: Assert hosts.deny entries
  ansible.builtin.assert:
    that:
      - "'ALL: ALL' in hosts_deny.stdout"
