---
- name: Verify journald settings
  ansible.builtin.command:
    cmd: grep -F "{{ item }}" /etc/systemd/journald.conf
  register: journald_conf
  changed_when: false
  failed_when: journald_conf.rc != 0
  with_items:
    - Storage={{ journald_storage }}
    - ForwardToSyslog={{ 'yes' if (journald_forwardtosyslog | bool) else 'no' }}
    - Compress={{ 'yes' if (journald_compress | bool) else 'no' }}

- name: Verify rsyslog FileCreateMode
  become: true
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  ansible.builtin.shell: |
    set -o pipefail
    rsyslogd -N3 -d 2>&1 | grep -o '\$FileCreateMode.*' | awk '{ if ($NF!="{{ rsyslog_filecreatemode }}") exit 1}'
  args:
    executable: /bin/bash
  register: rsyslog_filecreate
  changed_when: false
  failed_when: rsyslog_filecreate.rc != 0
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Ensure daily-logrotate.timer is enabled and active
  ansible.builtin.systemd:
    name: daily-logrotate.timer
    state: started
    enabled: true
  register: logrotate_timer
  failed_when: logrotate_timer.changed
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
