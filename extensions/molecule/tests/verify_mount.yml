---
- name: Verify mounts
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
  block:
    - name: Verify noexec /dev/shm
      ansible.builtin.shell:
        cmd: grep '^tmpfs[[:space:]]/dev/shm.*noexec' /proc/mounts
      register: dev_shm_noexec
      changed_when: false
      failed_when: dev_shm_noexec.rc != 0

    - name: Verify /proc hidepid
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^proc[[:space:]]+/proc proc rw,nosuid,nodev,noexec,relatime.*hidepid=({{ hide_pid }}|invisible)' /proc/mounts
      args:
        executable: /bin/bash
      register: proc_opts
      changed_when: false
      failed_when: proc_opts.rc != 0

    - name: Verify /proc process group
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^proc[[:space:]]+/proc proc rw,nosuid,nodev,noexec.*gid={{ process_group }}' /proc/mounts
      args:
        executable: /bin/bash
      register: proc_opts
      changed_when: false
      failed_when: proc_opts.rc != 0
      when:
        - process_group != 0

    - name: Verify tmp.mount
      become: true
      ansible.builtin.systemd_service:
        name: tmp.mount
      register: tmp_mount
      changed_when: false
      failed_when: >-
        tmp_mount.status is not defined or
        tmp_mount.status.Options is not defined or
        'nosuid' not in tmp_mount.status.Options or
        'nodev' not in tmp_mount.status.Options or
        'noexec' not in tmp_mount.status.Options

    - name: Verify /tmp nosuid
      become: true
      ansible.builtin.shell:
        cmd: grep '^tmpfs[[:space:]]/tmp[[:space:]].*nosuid' /proc/mounts
      register: mounts_tmp_nosuid
      changed_when: false
      failed_when: mounts_tmp_nosuid.rc != 0

    - name: Verify /tmp nodev
      become: true
      ansible.builtin.shell:
        cmd: grep '^tmpfs[[:space:]]/tmp[[:space:]].*nodev' /proc/mounts
      register: mounts_tmp_nodev
      changed_when: false
      failed_when: mounts_tmp_nodev.rc != 0

    - name: Verify /tmp noexec
      become: true
      ansible.builtin.shell:
        cmd: grep '^tmpfs[[:space:]]/tmp[[:space:]].*noexec' /proc/mounts
      register: mounts_tmp_noexec
      changed_when: false
      failed_when: mounts_tmp_noexec.rc != 0
