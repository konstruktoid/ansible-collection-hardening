---
- name: Stat /etc/default/apport
  ansible.builtin.stat:
    path: /etc/default/apport
  register: apport_default

- name: Get Apport settings
  ansible.builtin.command:
    cmd: grep -Ev '#|^$' /etc/default/apport
  changed_when: false
  register: apport_settings
  when:
    - apport_default.stat.exists

- name: Assert Apport is disabled
  ansible.builtin.assert:
    that:
      - "'enabled=0' in apport_settings.stdout_lines"
    success_msg: "apport is disabled in /etc/default/apport"
    fail_msg: "apport is not disabled in /etc/default/apport: {{ apport_settings.stdout }}"
  when:
    - apport_default.stat.exists
