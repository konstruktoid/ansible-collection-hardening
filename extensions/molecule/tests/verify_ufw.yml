---
- name: Verify UFW
  become: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
  block:
    - name: Get UFW status
      become: true
      ansible.builtin.command:
        cmd: ufw status verbose
      changed_when: false
      register: ufw_status
      failed_when: >
        'deny (incoming)' not in ufw_status.stdout or
        'deny (outgoing)' not in ufw_status.stdout or
        'disabled (routed)' not in ufw_status.stdout

    - name: Get UFW outgoing rules
      ansible.builtin.shell: |
        set -o pipefail
        ufw status verbose | grep -E "([0-9]{1,5}(/tcp|/udp|\s))\s+ALLOW OUT.*# ansible managed$"
      args:
        executable: /bin/bash
      register: ufw_outgoing_rules
      changed_when: false

    - name: Print UFW outgoing rules
      ansible.builtin.debug:
        msg: "{{ ufw_outgoing_rules.stdout }}"

    - name: Assert UFW outgoing rules
      ansible.builtin.assert:
        that:
          - "'22/tcp' in ufw_outgoing_rules.stdout"
          - "'53' in ufw_outgoing_rules.stdout"
          - "'80/tcp' in ufw_outgoing_rules.stdout"
          - "'123/udp' in ufw_outgoing_rules.stdout"
          - "'443/tcp' in ufw_outgoing_rules.stdout"
          - "'853' in ufw_outgoing_rules.stdout"
        fail_msg: "Expected UFW outgoing rules not found"

    - name: Stat UFW rules
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ufw show added | grep '^ufw' | grep -F -i -v "comment 'ansible managed'" | sed 's/^ufw //g'
        executable: /bin/bash
      changed_when: false
      failed_when: ufw_not_managed.rc > 1
      register: ufw_not_managed

    - name: Assert UFW rules are managed
      ansible.builtin.assert:
        that:
          - ufw_not_managed.stdout == ""
        fail_msg: "There are UFW rules not managed by Ansible: {{ ufw_not_managed.stdout_lines }}"

    - name: Get UFW rules without a port or source
      ansible.builtin.shell: |
        set -o pipefail
        ufw status verbose | grep -P '^Anywhere( \(v6\))? on (?!lo\b)\S+\s+(ALLOW|LIMIT) IN\s+Anywhere'
      args:
        executable: /bin/bash
      register: ufw_open_rules
      changed_when: false
      failed_when: ufw_open_rules.rc > 1

    - name: Assert no interface-wide allow or limit rule exists
      ansible.builtin.assert:
        that:
          - ufw_open_rules.stdout == ""
        fail_msg: "Interface-wide rules bypass the default deny: {{ ufw_open_rules.stdout_lines }}"

    - name: Get rate limited admin rules
      ansible.builtin.command:
        cmd: ufw show added
      changed_when: false
      register: ufw_added

    - name: Set the distinct expected admin rules
      ansible.builtin.set_fact:
        ufw_expected_admin_rules: >-
          {% set rules = [] %}
          {% for net in ufw_admin_net %}
          {% for port in ufw_ports %}
          {% set action = 'limit' if ufw_rate_limit | bool else 'allow' %}
          {% set target = port ~ '/tcp' if net in ['0.0.0.0/0', '::/0'] else 'from ' ~ net ~ ' to any port ' ~ port ~ ' proto tcp' %}
          {% set _ = rules.append('ufw ' ~ action ~ ' ' ~ target) %}
          {% endfor %}
          {% endfor %}
          {{ rules | unique | list | to_json }}

    - name: Assert each expected admin rule is present
      ansible.builtin.assert:
        that:
          - item in (ufw_added.stdout_lines | map('regex_replace', ' comment .*$', '') | list)
        fail_msg: "Missing admin rule {{ item }}: {{ ufw_added.stdout_lines }}"
      loop: "{{ ufw_expected_admin_rules | from_json }}"

    - name: Assert limit rules exist only for the admin rules
      ansible.builtin.assert:
        that:
          - >-
            (ufw_added.stdout_lines | select('match', '^ufw limit ') | list | length)
            == (ufw_expected_admin_rules | from_json | length if ufw_rate_limit | bool else 0)
        fail_msg: "Unexpected ufw limit rules: {{ ufw_added.stdout_lines }}"

    - name: "Stat /etc/default/ufw"
      ansible.builtin.stat:
        path: "/etc/default/ufw"
      register: "ufw_default_stat"

    - name: "Assert /etc/default/ufw ownership and mode"
      ansible.builtin.assert:
        that:
          - "ufw_default_stat.stat.pw_name == 'root'"
          - "ufw_default_stat.stat.gr_name == 'root'"
          - "ufw_default_stat.stat.mode == '0640'"
