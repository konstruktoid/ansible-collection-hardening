---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Intersect installed packages with blocklist
  ansible.builtin.set_fact:
    blocked_installed_packages: "{{ ansible_facts.packages.keys() | intersect(packages_blocklist) }}"

- name: Assert package removal
  ansible.builtin.assert:
    that:
      - blocked_installed_packages | length == 0

- name: Verify needrestart interpreter scanners are disabled
  when:
    - '"needrestart" in ansible_facts.packages'
    - packages_needrestart_disable_interpscan
  block:
    - name: Check the effective needrestart interpreter scanner setting
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          grep -hoE '^[[:space:]]*\$nrconf\{interpscan\}[[:space:]]*=[[:space:]]*[0-9]+' /dev/null
          $(find /etc/needrestart/conf.d/ -name '*.conf' 2>/dev/null | sort)
          | tail -n1
        executable: /bin/bash
      register: needrestart_interpscan_check
      changed_when: false
      failed_when: needrestart_interpscan_check.stdout is not search('= *0$')
