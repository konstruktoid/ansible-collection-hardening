---
- name: Verify logind settings
  ansible.builtin.shell: |
    set -o pipefail
    systemd-analyze cat-config systemd/logind.conf | grep "^{{ item }}"
  args:
    executable: /bin/bash
  register: logind_conf
  changed_when: false
  failed_when: logind_conf.rc != 0
  with_items:
    - KillUserProcesses={{ 'true' if logindconf_logind.killuserprocesses else 'false' }}
    - KillExcludeUsers={{ logindconf_logind.killexcludeusers | join(' ') }}
    - IdleAction={{ logindconf_logind.idleaction }}
    - IdleActionSec={{ logindconf_logind.idleactionsec }}
    - RemoveIPC={{ 'true' if logindconf_logind.removeipc else 'false' }}
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Verify StopIdleSessionSec setting
  ansible.builtin.shell: |
    set -o pipefail
    systemd-analyze cat-config systemd/logind.conf | grep "^{{ item }}"
  args:
    executable: /bin/bash
  register: stopidlesession
  changed_when: false
  failed_when: stopidlesession.rc != 0
  with_items:
    - StopIdleSessionSec={{ logindconf_session_timeout }}
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
    - ansible_facts.systemd.version | int >= 252
