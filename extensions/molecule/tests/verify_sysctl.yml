---
- name: Set sysctl configuration directory as fact
  block:
    - name: Stat /usr/lib/sysctl.d/
      ansible.builtin.stat:
        path: /usr/lib/sysctl.d/
      register: sysctl_usr_lib_sysctl_d

    - name: Set sysctl_conf_dir fact based on /usr/lib/sysctl.d/ existence
      ansible.builtin.set_fact:
        sysctl_conf_dir: >-
          {{ '/usr/lib/sysctl.d'
          if sysctl_usr_lib_sysctl_d.stat.exists
          else '/etc/sysctl.d' }}

- name: Stat IPv6 status
  become: true
  ansible.builtin.stat:
    path: /proc/sys/net/ipv6
  register: stat_ipv6

- name: Set IPv6 fact
  ansible.builtin.set_fact:
    system_has_ipv6: "{{ stat_ipv6.stat.exists }}"

- name: Set sysctl configuration directory as fact
  block:
    - name: Stat /usr/lib/sysctl.d/ exists
      ansible.builtin.stat:
        path: /usr/lib/sysctl.d/
      register: usr_lib_sysctl_d

    - name: Set sysctl fact
      ansible.builtin.set_fact:
        usr_lib_sysctl_d_dir: "{{ true if usr_lib_sysctl_d.stat.exists else false }}"

- name: Print sysctl configuration directory
  ansible.builtin.debug:
    msg: "{{ sysctl_conf_dir }}"

- name: Stat the main sysctl hardening file
  become: true
  ansible.builtin.stat:
    path: "{{ sysctl_conf_dir }}/zz-main-hardening.conf"
  register: sysctl_main_hardening_file

- name: Verify the sysctl hardening file was written to the resolved directory
  ansible.builtin.assert:
    that:
      - sysctl_conf_dir | length > 0
      - sysctl_main_hardening_file.stat.exists
    fail_msg: >-
      Expected {{ sysctl_conf_dir }}/zz-main-hardening.conf to exist.
      An empty sysctl_conf_dir means the directory was neither supplied nor detected.
    success_msg: "sysctl hardening file present in {{ sysctl_conf_dir }}"

- name: Merge sysctl settings
  ansible.builtin.set_fact:
    sysctl_settings: "{{ generic_sysctl_settings | combine(ipv4_sysctl_settings) }}"

- name: Verify sysctl configuration
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    /lib/systemd/systemd-sysctl --cat-config | grep -F -- {{ (item.key ~ " = " ~ item.value) | quote }}
  args:
    executable: /bin/bash
  with_dict: >-
    {{
      sysctl_settings
      | dict2items
      | rejectattr('key', 'search', 'nf_conntrack')
      | rejectattr('key', 'search', 'unprivileged_userns_clone')
      | items2dict
    }}
  register: sysctl_file_config
  changed_when: false
  failed_when: sysctl_file_config.rc != 0
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Verify sysctl runtime configuration
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    sysctl -a | grep -F -- {{ (item.key ~ " = " ~ item.value) | quote }}
  args:
    executable: /bin/bash
  with_dict: >-
    {{
      sysctl_settings
      | dict2items
      | rejectattr('key', 'search', 'nf_conntrack')
      | rejectattr('key', 'search', 'unprivileged_userns_clone')
      | items2dict
    }}
  register: sysctl_runtime_config
  changed_when: false
  failed_when: sysctl_runtime_config.rc != 0
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: IPv6 sysctl configuration
  become: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
  block:
    - name: Verify IPv6 sysctl configuration
      ansible.builtin.shell: |
        set -o pipefail
        /lib/systemd/systemd-sysctl --cat-config | grep -F -- {{ item | quote }}
      args:
        executable: /bin/bash
      register: sysctl_ipv6_config
      changed_when: false
      failed_when: sysctl_ipv6_config.rc != 0
      with_items:
        - net.ipv6.conf.all.disable_ipv6 = 1
        - net.ipv6.conf.default.disable_ipv6 = 1
      when:
        - disable_ipv6

    - name: Verify IPv6 sysctl runtime configuration
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ansible.builtin.shell: |
        set -o pipefail
        sysctl -a | grep -F -- {{ (item.key ~ " = " ~ (item.value | int)) | quote }}
      args:
        executable: /bin/bash
      with_dict: "{{ ipv6_disable_sysctl_settings }}"
      register: sysctl_ipv6
      changed_when: false
      failed_when: sysctl_ipv6.rc != 0
      when:
        - system_has_ipv6
        - disable_ipv6

- name: Stat io_uring_disabled availability
  become: true
  ansible.builtin.stat:
    path: /proc/sys/kernel/io_uring_disabled
  register: stat_io_uring_disabled

- name: Set io_uring fact
  ansible.builtin.set_fact:
    system_has_io_uring_disabled: "{{ stat_io_uring_disabled.stat.exists }}"

- name: IO_uring sysctl configuration
  become: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
    - system_has_io_uring_disabled
  block:
    - name: Verify io_uring sysctl configuration
      ansible.builtin.shell: |
        set -o pipefail
        /lib/systemd/systemd-sysctl --cat-config | grep -F -- {{ ("kernel.io_uring_disabled = " ~ sysctl_io_uring_disabled) | quote }}
      args:
        executable: /bin/bash
      register: sysctl_io_uring_config
      changed_when: false
      failed_when: sysctl_io_uring_config.rc != 0

    - name: Verify io_uring sysctl runtime configuration
      ansible.builtin.shell: |
        set -o pipefail
        sysctl -a | grep -F -- {{ ("kernel.io_uring_disabled = " ~ sysctl_io_uring_disabled) | quote }}
      args:
        executable: /bin/bash
      register: sysctl_io_uring_runtime
      changed_when: false
      failed_when: sysctl_io_uring_runtime.rc != 0

- name: Verify an explicitly configured sysctl_conf_dir is preserved
  block:
    - name: Set an explicit sysctl_conf_dir
      ansible.builtin.set_fact:
        sysctl_conf_dir: "/etc/sysctl.d"

    - name: Resolve the sysctl configuration directory with an explicit value
      ansible.builtin.include_role:
        name: konstruktoid.hardening.sysctl
        tasks_from: set_conf_dir.yml

    - name: Verify the explicit sysctl_conf_dir was not overwritten by detection
      ansible.builtin.assert:
        that:
          - sysctl_conf_dir == "/etc/sysctl.d"
        fail_msg: >-
          An explicitly configured sysctl_conf_dir was overwritten with
          {{ sysctl_conf_dir }}.
        success_msg: "An explicitly configured sysctl_conf_dir is preserved"

    - name: Restore the detected sysctl_conf_dir
      ansible.builtin.set_fact:
        sysctl_conf_dir: >-
          {{ '/usr/lib/sysctl.d'
          if sysctl_usr_lib_sysctl_d.stat.exists
          else '/etc/sysctl.d' }}
