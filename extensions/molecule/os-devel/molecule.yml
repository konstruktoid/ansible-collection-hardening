---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: forky
    image_url: "https://cloud.debian.org/images/cloud/forky/daily/latest/debian-14-generic-amd64-daily.qcow2"
    ssh_user: debian
    ssh_user_group: sudo
    ssh_port: 22301
    memory: 1024
    cpus: 1
  - name: stonking
    image_url: "https://cloud-images.ubuntu.com/stonking/current/stonking-server-cloudimg-amd64.img"
    ssh_user: ubuntu
    ssh_user_group: sudo
    ssh_port: 22302
    memory: 1024
    cpus: 1
provisioner:
  name: ansible
  playbooks:
    converge: "../resources/converge.yml"
    prepare: "../resources/prepare.yml"
    verify: "../resources/verify.yml"
  config_options:
    defaults:
      callback_whitelist: profile_tasks
      interpreter_python: auto_silent
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  log: true
  inventory:
    group_vars:
      molecule:
        ansible_become: true
    host_vars:
      forky:
      stonking:
verifier:
  name: ansible
scenario:
  name: os-devel
  create_sequence:
    - dependency
    - create
    - prepare
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
