---
name: Molecule testing workflow
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 5 * * */3"
  workflow_dispatch:
permissions: {}
concurrency:
  group: molecule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tox-docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          uv tool install tox --with tox-uv

      - name: Test stable releases
        run: |
          tox run -e docker

      - name: Upload task coverage records
        if: always() && hashFiles('molecule-logs/**/task_coverage.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: task-coverage-docker
          path: molecule-logs/*/task_coverage.jsonl
          retention-days: 14

  tox-docker-upstream:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          uv tool install tox --with tox-uv

      - name: Test upstream code
        run: |
          tox run -e docker-upstream

      - name: Upload task coverage records
        if: always() && hashFiles('molecule-logs/**/task_coverage.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: task-coverage-docker-upstream
          path: molecule-logs/*/task_coverage.jsonl
          retention-days: 14

  tox-qemu:
    name: Test stable releases on QEMU virtual machines
    runs-on: ubuntu-26.04
    # The first run took 19 minutes, so this leaves room for slow image downloads and mirrors.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Audit rather than block: the guests reach distribution, EPEL and mirror
      # endpoints through QEMU user networking, so the egress set is neither
      # stable nor knowable in advance.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get --assume-yes --no-install-recommends install \
            genisoimage \
            ovmf \
            qemu-system-x86 \
            qemu-utils
          uv tool install tox --with tox-uv

      # The device is handed to the workflow user by ownership rather than the
      # widely copied world-writable MODE="0666" rule: adding the user to the
      # kvm group has no effect on the already authenticated runner session,
      # while OWNER applies to the static node immediately.
      - name: Allow the runner user to use KVM
        run: |
          set -euo pipefail
          printf 'KERNEL=="kvm", OWNER="%s", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"\n' \
            "$(id -un)" | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not accessible to $(id -un), the guests would fall back to TCG"
            ls -l /dev/kvm
            exit 1
          fi

      - name: Test stable releases on QEMU
        run: |
          set -euo pipefail
          tox run -e qemu

      - name: Upload Molecule logs
        if: always() && hashFiles('molecule-logs/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: molecule-logs-qemu
          path: molecule-logs/
          retention-days: 14

      - name: Upload task coverage records
        if: always() && hashFiles('molecule-logs/**/task_coverage.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: task-coverage-qemu
          path: molecule-logs/*/task_coverage.jsonl
          retention-days: 14

  coverage-report:
    name: Report task coverage
    # A single job after the Molecule jobs, because the report is only useful merged: the platform by role matrix
    # needs the container and virtual machine runs side by side, which per job reports could not show.
    needs:
      - tox-docker
      - tox-docker-upstream
      - tox-qemu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Download task coverage records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: task-coverage-*
          path: molecule-logs

      - name: Report task coverage
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python scripts/coverage_report.py molecule-logs

      - name: Upload coverage report
        if: always() && hashFiles('molecule-logs/coverage.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: task-coverage-report
          path: molecule-logs/coverage.json
          retention-days: 14
