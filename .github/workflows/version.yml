---
name: Collection version
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions: {}
concurrency:
  group: version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check galaxy.yml, CHANGELOG.md and tag agree
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' galaxy.yml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=galaxy.yml::version must be a quoted MAJOR.MINOR.PATCH value."
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## ${version} (YYYY-MM-DD)' heading for the galaxy.yml version."
            exit 1
          fi
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" != "v${version}" ]]; then
            echo "::error file=galaxy.yml::Tag ${REF_NAME} does not match galaxy.yml version ${version}."
            exit 1
          fi
          echo "galaxy.yml version ${version} is consistent."
