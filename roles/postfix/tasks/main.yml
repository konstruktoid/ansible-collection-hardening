---
- name: Install Postfix
  become: true
  ansible.builtin.package:
    name: postfix
    state: present
    update_cache: true

- name: Stat postfix main.cf
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf

- name: Configure Postfix
  become: true
  when:
    - postfix_main_cf.stat.exists
  notify:
    - Restart Postfix
  block:
    - name: Configure Postfix disable_vrfy_command
      ansible.builtin.lineinfile:
        regexp: ^disable_vrfy_command
        dest: /etc/postfix/main.cf
        line: disable_vrfy_command = yes
        state: present

    - name: Configure Postfix inet_interfaces
      ansible.builtin.lineinfile:
        regexp: ^inet_interfaces
        dest: /etc/postfix/main.cf
        line: inet_interfaces = loopback-only
        state: present

    - name: Configure Postfix smtpd_banner
      ansible.builtin.lineinfile:
        regexp: ^smtpd_banner
        dest: /etc/postfix/main.cf
        line: smtpd_banner = \$myhostname - ESMTP
        state: present

    - name: Configure Postfix smtpd_client_restrictions
      ansible.builtin.lineinfile:
        regexp: ^smtpd_client_restrictions
        dest: /etc/postfix/main.cf
        line: smtpd_client_restrictions = permit_mynetworks,reject

    - name: Configure Postfix smtpd_data_restrictions
      ansible.builtin.lineinfile:
        regexp: ^smtpd_data_restrictions
        dest: /etc/postfix/main.cf
        line: smtpd_data_restrictions = reject_unauth_pipelining

    - name: Configure Postfix smtpd_discard_ehlo_keywords
      ansible.builtin.lineinfile:
        regexp: ^smtpd_discard_ehlo_keywords
        dest: /etc/postfix/main.cf
        line: smtpd_discard_ehlo_keywords = chunking, silent-discard
