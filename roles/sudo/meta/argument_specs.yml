---
argument_specs:
  main:
    short_description: "SUDO configuration and hardening."
    description:
      - "SUDO configuration and hardening."
    author:
      - "Thomas Sjögren (@konstruktoid)"
    options:
      sudo_passwd_timeout:
        type: "int"
        default: 1
        description:
          - "Number of minutes a password prompt remains valid for sudo authentication."
      sudo_timestamp_timeout:
        type: "int"
        default: 5
        description:
          - "Number of minutes before sudo credential timestamps expire."
      sudo_logfile:
        type: "str"
        default: "/var/log/sudo.log"
        description:
          - "Path to the sudo log file used for command auditing."
