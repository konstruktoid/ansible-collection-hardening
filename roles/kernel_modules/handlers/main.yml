---
- name: Rebuild initramfs on Debian # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: update-initramfs -u
  listen: Rebuild initramfs
  when:
    - ansible_facts.os_family == "Debian"
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Rebuild initramfs on RedHat # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: dracut -f
  listen: Rebuild initramfs
  when:
    - ansible_facts.os_family == "RedHat"
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
