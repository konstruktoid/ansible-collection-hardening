---
- name: Ensure kmod is installed
  become: true
  ansible.builtin.package:
    name: kmod
    state: present

- name: Write kernel module blacklist configuration
  become: true
  block:
    - name: Blacklist kernel file system modules
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/disablefs.conf
        line: blacklist {{ item }}
        mode: "0644"
        owner: root
        group: root
        state: present
        create: true
      with_items:
        - "{{ fs_modules_blocklist }}"

    - name: Blacklist kernel network modules
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/disablenet.conf
        line: blacklist {{ item }}
        mode: "0644"
        owner: root
        group: root
        state: present
        create: true
      with_items:
        - "{{ net_modules_blocklist }}"

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Set fact if usbguard is installed
      ansible.builtin.set_fact:
        usbguard_installed: "{{ 'usbguard' in ansible_facts.packages }}"

    - name: Allow USB-prefixed kernel modules if USBGuard is used
      ansible.builtin.set_fact:
        misc_modules_usbguard: "{{ misc_modules_blocklist | reject('match', '^usb-') | list }}"
      when:
        - usbguard_installed

    - name: Blacklist misc kernel modules
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/disablemod.conf
        line: blacklist {{ item }}
        mode: "0644"
        owner: root
        group: root
        state: present
        create: true
      with_items:
        - "{{ misc_modules_usbguard if usbguard_installed else misc_modules_blocklist }}"

    - name: Stat blacklisted kernel modules
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          /usr/sbin/modprobe -c | grep -o '^blacklist .*' | awk '{print $2}'
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: modprobe_blacklist.rc != 0
      register: modprobe_blacklist

    - name: Block blacklisted kernel modules
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/blacklist-blocked.conf
        line: install {{ item }} /bin/true
        mode: "0644"
        owner: root
        group: root
        state: present
        create: true
      with_items:
        - "{{ modprobe_blacklist.stdout_lines | sort | unique }}"
