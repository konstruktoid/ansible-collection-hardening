---
- name: Verify
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Reboot and reconnect
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Reboot host
          become: true
          ansible.builtin.reboot:

        - name: Wait for the host and reconnect
          ansible.builtin.wait_for:
            port: 22
            host: "{{ (ansible_facts.ssh_host | default(ansible_facts.host)) | default(inventory_hostname) }}"
            delay: 10
            timeout: 120

    - name: Include default vars
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions:
          - yml

    - name: Include host vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/host_vars/{{ ansible_facts.hostname }}"

    - name: Verify Ctrl-Alt-Del
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Get Ctrl-Alt-Del target status
          ansible.builtin.systemd_service:
            name: ctrl-alt-del.target
          register: ctrl_alt_del_target

        - name: Verify Ctrl-Alt-Del target LoadState
          ansible.builtin.systemd_service:
            name: ctrl-alt-del.target
          register: ctrl_alt_del_target
          failed_when:
            - ctrl_alt_del_target.status.LoadState != "masked"
            - not "reboot.target" in ctrl_alt_del_target.status.FragmentPath
