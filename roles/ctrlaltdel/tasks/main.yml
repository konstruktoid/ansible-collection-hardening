---
- name: Remove existing ctrl-alt-del.target override before masking
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ctrl-alt-del.target
    state: absent
- name: Disable systemd ctrl-alt-del
  become: true
  ansible.builtin.systemd_service:
    name: ctrl-alt-del.target
    masked: true
    enabled: false
    state: stopped
  register: ctrl_alt_del_target_state
  failed_when:
    - ctrl_alt_del_target_state.failed
    - not "already exists and is a symlink" in ctrl_alt_del_target_state.msg
