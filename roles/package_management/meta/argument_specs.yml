---
argument_specs:
  main:
    short_description: "Configure the APT and DNF and optionally upgrade the installed packages to the latest version."
    description:
      - "Configure the APT and DNF and optionally upgrade the installed packages to the latest version."
    author:
      - "Thomas Sjögren (@konstruktoid)"
    options:
      apt_options:
        description: "Options used to configure the APT suite of tools."
        type: "list"
        elements: "str"
        default:
          - 'Acquire::AllowDowngradeToInsecureRepositories "0";'
          - 'Acquire::AllowInsecureRepositories "0";'
          - 'Acquire::AllowWeakRepositories "0";'
          - 'Acquire::Check-Date "true";'
          - 'Acquire::http::AllowRedirect "false";'
          - 'APT::Get::AllowUnauthenticated "false";'
          - 'APT::Get::AutomaticRemove "true";'
          - 'APT::Install-Recommends "0";'
          - 'APT::Install-Suggests "0";'
          - 'APT::Periodic::AutocleanInterval "7";'
          - 'APT::Sandbox::Seccomp "1";'
          - 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
          - 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'
      apt_seccomp_broken_releases:
        description: >-
          Debian releases where APT's seccomp sandbox aborts the acquire methods,
          C(E:Method file has died unexpectedly!), and where C(APT::Sandbox::Seccomp)
          therefore has to be left off.
        type: "list"
        elements: "str"
        default:
          - "forky"
          - "trixie"
      system_upgrade:
        description: "If True, then the installed packages will be upgraded to the latest version using C(apt) or C(dnf)."
        type: "bool"
        default: true
