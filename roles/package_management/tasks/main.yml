---
- name: Apt configuration and upgrades
  become: true
  when:
    - ansible_facts.os_family == "Debian"
  block:
    - name: Configure APT
      ansible.builtin.lineinfile:
        dest: /etc/apt/apt.conf.d/99-hardening
        owner: root
        group: root
        mode: "0644"
        state: present
        create: true
        regexp: '^{{ item.split(" ") | first | regex_escape }}\s'
        line: "{{ item }}"
      loop: "{{ apt_options }}"
      when: >-
        item != 'APT::Sandbox::Seccomp "1";' or
        ansible_facts.distribution_release not in apt_seccomp_broken_releases

    - name: Remove APT seccomp sandboxing on affected Debian releases
      ansible.builtin.lineinfile:
        dest: /etc/apt/apt.conf.d/99-hardening
        owner: root
        group: root
        mode: "0644"
        line: 'APT::Sandbox::Seccomp "1";'
        state: absent
      when:
        - ansible_facts.distribution_release in apt_seccomp_broken_releases

    - name: Use HTTPS for the official APT archives
      when:
        - package_management_https_sources | bool
      block:
        - name: Install ca-certificates
          ansible.builtin.apt:
            name: ca-certificates
            state: present
            update_cache: true

        - name: Find APT source files
          ansible.builtin.find:
            paths:
              - /etc/apt
              - /etc/apt/sources.list.d
              - /etc/apt/mirrors
            patterns:
              - "*.list"
              - "*.sources"
          register: package_management_apt_sources

        - name: Change official APT archive URIs to HTTPS
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: 'http://(deb\.debian\.org|security\.debian\.org|(?:archive|security|ports)\.ubuntu\.com)(?=[/\s]|$)'
            replace: 'https://\1'
          loop: "{{ package_management_apt_sources.files | map(attribute='path') | sort }}"
          notify:
            - Update apt cache

        # The package lists are stored per URI, so refresh them before anything installs a package.
        - name: Flush handlers
          ansible.builtin.meta: flush_handlers

    - name: Run apt upgrade
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
      when:
        - system_upgrade | bool
      notify:
        - Run apt-get clean
        - Run apt-get autoremove

- name: Dnf configuration
  become: true
  when:
    - ansible_facts.os_family == "RedHat"
  block:
    - name: Set yum.conf gpgcheck
      ansible.builtin.lineinfile:
        regexp: ^gpgcheck=
        line: gpgcheck=1
        dest: /etc/yum.conf
        mode: "0644"
        state: present
        create: true
        insertafter: "[main]"

    - name: Set yum.conf clean_requirements
      ansible.builtin.lineinfile:
        regexp: ^clean_requirements_on_remove=
        line: clean_requirements_on_remove=1
        dest: /etc/yum.conf
        mode: "0644"
        state: present
        create: true
        insertafter: "[main]"

    - name: Set yum.conf localpkg_gpgcheck
      ansible.builtin.lineinfile:
        regexp: ^localpkg_gpgcheck=
        line: localpkg_gpgcheck=1
        dest: /etc/yum.conf
        mode: "0644"
        state: present
        create: true
        insertafter: "[main]"

    - name: Set yum.conf repo_gpgcheck
      ansible.builtin.lineinfile:
        regexp: ^repo_gpgcheck=
        line: repo_gpgcheck=1
        dest: /etc/yum.conf
        mode: "0644"
        state: present
        create: true
        insertafter: "[main]"

- name: Enable dnf repositories and upgrades
  become: true
  when:
    - ansible_facts.os_family == "RedHat"
  block:
    - name: Stat PowerTools repository files
      ansible.builtin.stat:
        path: "{{ item }}"
      with_items:
        - /etc/yum.repos.d/almalinux-crb.repo
        - /etc/yum.repos.d/almalinux-powertools.repo
      register: "package_management_powertools_repo"

    - name: Enable the PowerTools repository
      ansible.builtin.replace:
        regexp: ^enabled=.*$
        replace: enabled=1
        dest: "{{ item.stat.path }}"
      with_items:
        - "{{ package_management_powertools_repo.results }}"
      when:
        - item.stat.exists

    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Run dnf upgrade
      ansible.builtin.dnf:
        name: "*" # noqa: package-latest
        state: latest
        bugfix: true
        security: true
        nobest: true
      when:
        - system_upgrade | bool
      notify:
        - Run dnf autoremove
