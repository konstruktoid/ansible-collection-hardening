---
# Options used to configure the APT suite of tools.
package_management_apt_options:
  - 'Acquire::AllowDowngradeToInsecureRepositories "0";'
  - 'Acquire::AllowInsecureRepositories "0";'
  - 'Acquire::AllowWeakRepositories "0";'
  - 'Acquire::Check-Date "true";'
  - 'Acquire::http::AllowRedirect "false";'
  - 'APT::Get::AllowUnauthenticated "false";'
  - 'APT::Get::AutomaticRemove "true";'
  - 'APT::Install-Recommends "0";'
  - 'APT::Install-Suggests "0";'
  - 'APT::Periodic::AutocleanInterval "7";'
  - 'APT::Sandbox::Seccomp "1";'
  - 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
  - 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'

# Debian releases where APT's seccomp sandbox aborts the acquire methods, C(E:Method file has died
# unexpectedly!), and where C(APT::Sandbox::Seccomp) therefore has to be left off.
package_management_apt_seccomp_broken_releases:
  - "forky"
  - "trixie"

# If True, then the installed packages will be upgraded to the latest version using C(apt) or C(dnf).
package_management_system_upgrade: true
