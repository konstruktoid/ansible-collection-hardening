---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Run apt-get autoremove
  become: true
  ansible.builtin.apt:
    autoremove: true

- name: Run apt-get clean
  become: true
  ansible.builtin.apt:
    autoclean: true
    clean: true

- name: Run dnf autoremove
  become: true
  ansible.builtin.dnf:
    autoremove: true
  when:
    - ansible_facts.os_family == "RedHat"
