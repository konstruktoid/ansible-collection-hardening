---
- name: Verify
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Reboot and reconnect
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Reboot host
          become: true
          ansible.builtin.reboot:

        - name: Wait for the host and reconnect
          ansible.builtin.wait_for:
            port: 22
            host: "{{ (ansible_facts.ssh_host | default(ansible_facts.host)) | default(inventory_hostname) }}"
            delay: 10
            timeout: 120

    - name: Include default vars
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions:
          - yml

    - name: Include host vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/host_vars/{{ ansible_facts.hostname }}"

    - name: Stat access.conf
      ansible.builtin.stat:
        path: /etc/security/access.conf
      register: security_access_conf

    - name: Verify access.conf root entries
      when:
        - security_access_conf.stat.exists
      block:
        - name: Get access.conf root entries
          ansible.builtin.command:
            cmd: grep ':root:' /etc/security/access.conf
          register: access_conf_root
          changed_when: false
          failed_when: access_conf_root.rc not in [0, 1]

        - name: Assert access.conf root entries are correct
          ansible.builtin.assert:
            that:
              - "'+:root:127.0.0.1 ::1' in access_conf_root.stdout"
              - "'-:root:ALL' in access_conf_root.stdout"
            fail_msg: "access.conf does not contain expected root entries. Got: {{ access_conf_root.stdout }}"

    - name: Stat /etc/securetty
      ansible.builtin.stat:
        path: /etc/securetty
      register: securetty_stat

    - name: Assert /etc/securetty
      ansible.builtin.assert:
        that:
          - securetty_stat.stat.exists
          - securetty_stat.stat.size == 0
          - securetty_stat.stat.mode == "0000"
          - securetty_stat.stat.uid == 0
          - securetty_stat.stat.gid == 0
        fail_msg: "/etc/securetty does not have the expected properties. Got: {{ securetty_stat.stat }}"

    - name: Verify debug-shell.service is masked
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Gather all systemd unit info
          community.general.systemd_info:
            unitname:
              - debug-shell.service
          register: debug_shell_service
          failed_when:
            - debug_shell_service is failed
            - "'No units match' not in debug_shell_service.msg"

        - name: Assert debug-shell.service is masked
          ansible.builtin.assert:
            that:
              - debug_shell_service.status.LoadState == "masked"
            fail_msg: "debug-shell.service is not masked. LoadState: {{ debug_shell_service.status.LoadState }}"
          when:
            - debug_shell_service is success
            - "'No units match' not in debug_shell_service.msg"
