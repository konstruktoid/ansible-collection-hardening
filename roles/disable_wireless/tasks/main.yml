---
- name: Disable wireless interfaces
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  block:
    - name: Ensure nmcli is available
      ansible.builtin.command:
        cmd: nmcli --version
      register: nmcli_check
      changed_when: false
      failed_when: false

    - name: Turn off and disable wireless interfaces
      when:
        - nmcli_check.rc == 0
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Check Wi-Fi radio state
          ansible.builtin.command:
            cmd: nmcli radio wifi
          register: nmcli_radio_wifi
          changed_when: false
          failed_when: false

        - name: Check WWAN radio state
          ansible.builtin.command:
            cmd: nmcli radio wwan
          register: nmcli_radio_wwan
          changed_when: false
          failed_when: false

        - name: Turn off wireless interfaces
          become: true
          ansible.builtin.command:
            cmd: nmcli radio all off
          register: nmcli_radio_off
          when:
            - (nmcli_radio_wifi.stdout | default('') | trim | lower) == 'enabled' or (nmcli_radio_wwan.stdout | default('') | trim | lower) == 'enabled'

        - name: Get kernel modules
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              nmcli | grep wifi | grep -o '(.*)' | tr -d '()'
          args:
            executable: /bin/bash
          register: nmcli_output
          changed_when: false
          failed_when: false

        - name: Disable wireless kernel modules
          become: true
          community.general.modprobe:
            name: "{{ item }}"
            state: absent
            persistent: absent
          loop: "{{ nmcli_output.stdout_lines }}"
          when:
            - nmcli_output.stdout_lines is defined
            - nmcli_output.stdout_lines | length > 0
