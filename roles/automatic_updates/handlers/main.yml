---
- name: Restart unattended-upgrades
  become: true
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Run apt-get clean
  become: true
  ansible.builtin.apt:
    autoclean: true
    clean: true
    lock_timeout: 300

- name: Run apt-get autoremove
  become: true
  ansible.builtin.apt:
    autoremove: true
    lock_timeout: 300

- name: Run dnf autoremove
  become: true
  ansible.builtin.dnf:
    autoremove: true
  when:
    - ansible_facts.os_family == "RedHat"
  tags:
    - dnf
    - packages
