---
- name: Stat /etc/sysconfig/prelink
  ansible.builtin.stat:
    path: /etc/sysconfig/prelink
  register: sysconfig_prelink

- name: Stat /etc/prelink.conf
  ansible.builtin.stat:
    path: /etc/prelink.conf
  register: etc_prelink

- name: Ensure PRELINKING=no in /etc/sysconfig/prelink
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/prelink
    regexp: "^PRELINKING="
    line: PRELINKING=no
    mode: "0644"
    owner: root
    group: root
    state: present
  when:
    - sysconfig_prelink.stat.exists

- name: Get prelink version
  ansible.builtin.command:
    cmd: prelink --version
  register: prelink_version
  changed_when: false
  failed_when: false

- name: Run prelink -ua
  become: true
  ansible.builtin.command:
    cmd: prelink -ua
  when:
    - prelink_version.rc == 0
    - sysconfig_prelink.stat.exists or etc_prelink.stat.exists
