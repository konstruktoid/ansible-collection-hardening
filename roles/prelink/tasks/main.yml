---
- name: Stat /etc/sysconfig/prelink
  ansible.builtin.stat:
    path: /etc/sysconfig/prelink
  register: sysconfig_prelink

- name: Stat /etc/prelink.conf
  ansible.builtin.stat:
    path: /etc/prelink.conf
  register: etc_prelink

- name: Ensure PRELINKING=no in /etc/sysconfig/prelink
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/prelink
    regexp: '^PRELINKING='
    line: PRELINKING=no
    mode: "0644"
    owner: root
    group: root
    state: present
    create: true
  when:
    - ansible_facts.os_family == "RedHat"

- name: Run prelink -ua when /etc/prelink.conf exists
  become: true
  ansible.builtin.command:
    cmd: prelink -ua
  register: nonprelinked_state
  when: >
    sysconfig_prelink.stat.exists or
    etc_prelink.stat.exists
