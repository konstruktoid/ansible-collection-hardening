---
- name: Stat sysconfig prelink file
  ansible.builtin.stat:
    path: /etc/sysconfig/prelink
  register: sysconfig_prelink

- name: Stat prelink configuration file
  ansible.builtin.stat:
    path: /etc/prelink.conf
  register: etc_prelink

- name: Set PRELINKING=no in /etc/sysconfig/prelink
  become: true
  ansible.builtin.lineinfile:
    line: PRELINKING=no
    dest: /etc/sysconfig/prelink
    mode: "0644"
    state: present
    create: true
  when:
    - ansible_facts.os_family == "RedHat"
    - sysconfig_prelink.stat.exists

- name: Run prelink -ua to restore non-prelinked state
  become: true
  ansible.builtin.command:
    cmd: prelink -ua
  register: nonprelinked_state
  when: >
    sysconfig_prelink.stat.exists or
    etc_prelink.stat.exists
