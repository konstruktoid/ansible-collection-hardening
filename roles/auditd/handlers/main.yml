---
- name: Generate auditd rules
  become: true
  ansible.builtin.command:
    cmd: augenrules
  register: augenrules_handler
  changed_when:
    - augenrules_handler.rc == 0

- name: Enable auditd
  become: true
  ansible.builtin.service:
    name: auditd
    enabled: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Gather service facts for auditd reload
  become: true
  ansible.builtin.service_facts:
  listen: Reload auditd
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Signal auditd to reload its configuration
  become: true
  ansible.builtin.command:
    cmd: auditctl --signal reload
  register: auditd_reload_handler
  changed_when:
    - auditd_reload_handler.rc == 0
  listen: Reload auditd
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
    - ansible_facts.services.get('auditd.service', {}).get('state') == 'running'

- name: Update GRUB
  become: true
  ansible.builtin.command:
    cmd: update-grub
  register: update_grub
  changed_when: update_grub.rc == 0
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
