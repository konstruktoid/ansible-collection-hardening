---
- name: Set sysctl configuration directory as fact
  block:
    - name: Stat /usr/lib/sysctl.d/
      ansible.builtin.stat:
        path: /usr/lib/sysctl.d/
      register: sysctl_usr_lib_sysctl_d

    # Only detect when sysctl_conf_dir is unset, so that a directory supplied by
    # the user is honoured instead of being overwritten.
    - name: Set sysctl_conf_dir fact based on /usr/lib/sysctl.d/ existence
      ansible.builtin.set_fact:
        sysctl_conf_dir: >-
          {{ '/usr/lib/sysctl.d'
          if (usr_lib_sysctl_d_dir | bool or sysctl_usr_lib_sysctl_d.stat.exists)
          else '/etc/sysctl.d' }}
      when:
        - sysctl_conf_dir | default('', true) | length == 0
