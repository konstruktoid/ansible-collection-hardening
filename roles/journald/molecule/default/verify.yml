---
- name: Verify
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Reboot and reconnect
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Reboot host
          become: true
          ansible.builtin.reboot:

        - name: Wait for the host and reconnect
          ansible.builtin.wait_for:
            port: 22
            host: "{{ (ansible_facts.ssh_host | default(ansible_facts.host)) | default(inventory_hostname) }}"
            delay: 10
            timeout: 120

    - name: Include default vars
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions:
          - yml

    - name: Include host vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/host_vars/{{ ansible_facts.hostname }}"

    - name: Verify journald settings
      ansible.builtin.shell:
        cmd: grep "^{{ item }}$" /etc/systemd/journald.conf
      register: journald_conf
      changed_when: false
      failed_when: journald_conf.rc != 0
      with_items:
        - Storage={{ journald_storage }}
        - ForwardToSyslog={{ 'yes' if (journald_forwardtosyslog | bool) else 'no' }}
        - Compress={{ 'yes' if (journald_compress | bool) else 'no' }}

    - name: Verify rsyslog FileCreateMode
      become: true
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ansible.builtin.shell: |
        set -o pipefail
        rsyslogd -N3 -d 2>&1 | grep -o '\$FileCreateMode.*' | awk '{ if ($NF!="{{ rsyslog_filecreatemode }}") exit 1}'
      args:
        executable: /bin/bash
      register: rsyslog_filecreate
      changed_when: false
      failed_when: rsyslog_filecreate.rc != 0
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
