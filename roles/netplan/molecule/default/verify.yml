---
- name: Verify
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Reboot and reconnect
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Reboot host
          become: true
          ansible.builtin.reboot:

        - name: Wait for the host and reconnect
          ansible.builtin.wait_for:
            port: 22
            host: "{{ (ansible_facts.ssh_host | default(ansible_facts.host)) | default(inventory_hostname) }}"
            delay: 10
            timeout: 120

    - name: Include default vars
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions:
          - yml

    - name: Include host vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/host_vars/{{ ansible_facts.hostname }}"

    - name: Verify netplan files permissions
      become: true
      block:
        - name: Check if netplan directories exist
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /etc/netplan
            - /lib/netplan
            - /run/netplan
          register: netplan_dirs

        - name: Set netplan existing directories
          ansible.builtin.set_fact:
            netplan_existing_dirs: >-
              {{ netplan_dirs.results
                 | selectattr('stat.exists')
                 | map(attribute='item')
                 | list }}

        - name: Find all netplan configuration files
          when: netplan_existing_dirs | length > 0
          ansible.builtin.find:
            paths: "{{ netplan_existing_dirs }}"
            recurse: true
            patterns:
              - "*.yaml"
              - "*.yml"
          register: netplan_configuration

        - name: Gather netplan files metadata
          ansible.builtin.stat:
            path: "{{ item.path }}"
          loop: "{{ netplan_configuration.files | default([]) }}"
          register: netplan_configuration_stats

        - name: Assert netplan files permissions and ownership
          ansible.builtin.assert:
            that:
              - item.stat.mode == "0600"
              - item.stat.pw_name == "root"
              - item.stat.gr_name == "root"
            success_msg: >-
              {{ item.stat.path }} has correct permissions and ownership:
              {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }}
            fail_msg: >-
              {{ item.stat.path }} permissions or ownership are incorrect:
              {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }}
          loop: "{{ netplan_configuration_stats.results }}"
