---
- name: Disable aidecheck
  become: true
  ansible.builtin.systemd_service:
    name: aidecheck.timer
    state: stopped
    enabled: false
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Enable aidecheck
  become: true
  ansible.builtin.systemd_service:
    name: aidecheck.timer
    enabled: true
    state: started
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Mask aidecheck
  become: true
  ansible.builtin.systemd_service:
    name: aidecheck.timer
    masked: true
    state: stopped
    enabled: false
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
