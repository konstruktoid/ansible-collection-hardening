---
- name: Set UMASK in login.defs if it exists else add it
  become: true
  ansible.builtin.lineinfile:
    line: UMASK {{ umask_value }}
    mode: "0644"
    dest: /etc/login.defs
    regexp: ^\s*UMASK(\s+.*)$
    owner: root
    group: root

- name: Stat init.d/rc
  become: true
  ansible.builtin.stat:
    path: /etc/init.d/rc
  register: initdrc

- name: Set default rc umask
  become: true
  ansible.builtin.replace:
    regexp: umask(\s+.*)
    replace: umask {{ umask_value }}
    dest: /etc/init.d/rc
    mode: "0755"
  when:
    - initdrc.stat.exists

- name: Ensure that a umask line appears in rc
  become: true
  ansible.builtin.lineinfile:
    line: umask {{ umask_value }}
    mode: "0755"
    path: /etc/init.d/rc
    regexp: umask(\s+.*)
  when:
    - initdrc.stat.exists

- name: Stat bashrc
  become: true
  ansible.builtin.stat:
    path: /etc/bashrc
  register: bashrc

- name: Ensure that a umask line appears in bashrc
  become: true
  ansible.builtin.lineinfile:
    line: umask {{ umask_value }}
    mode: "0644"
    path: /etc/bashrc
    regexp: umask(\s+.*)
  when:
    - bashrc.stat.exists

- name: Stat bash.bashrc
  become: true
  ansible.builtin.stat:
    path: /etc/bash.bashrc
  register: bash_bashrc

- name: Ensure that a umask line appears in bash.bashrc
  become: true
  ansible.builtin.lineinfile:
    line: umask {{ umask_value }}
    mode: "0644"
    path: /etc/bash.bashrc
    regexp: umask(\s+.*)
  when:
    - bash_bashrc.stat.exists

- name: Stat csh.cshrc
  become: true
  ansible.builtin.stat:
    path: /etc/csh.cshrc
  register: cshrc

- name: Ensure that a umask line appears in csh.cshrc
  become: true
  ansible.builtin.lineinfile:
    line: umask {{ umask_value }}
    mode: "0644"
    path: /etc/csh.cshrc
    regexp: umask(\s+.*)
  when:
    - cshrc.stat.exists

- name: Ensure that a umask line appears in profile
  become: true
  ansible.builtin.lineinfile:
    line: umask {{ umask_value }}
    mode: "0644"
    path: /etc/profile
    regexp: umask(\s+.*)

- name: Stat /etc/profile.d
  become: true
  ansible.builtin.stat:
    path: /etc/profile.d
  register: umask_profile_d

- name: Find all files in /etc/profile.d
  become: true
  ansible.builtin.find:
    paths:
      - /etc/profile.d
    patterns:
      - "*"
  register: find_profiled_result
  when:
    - umask_profile_d.stat.exists
    - umask_profile_d.stat.isdir

- name: Set default profile umask for each file in /etc/profile.d
  become: true
  ansible.builtin.replace:
    regexp: umask(\s+.*)
    replace: umask {{ umask_value }}
    dest: "{{ item.path }}"
    mode: "0644"
  loop: "{{ find_profiled_result.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find PAM files containing pam_umask.so
  become: true
  ansible.builtin.find:
    paths: /etc/pam.d
    file_type: file
    contains: "pam_umask\\.so"
  register: pam_files

- name: Ensure pam_umask has the desired umask
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "^(.*pam_umask\\.so).*$"
    line: "\\1 umask={{ umask_value }}"
    backrefs: true
    mode: "0644"
    owner: root
    group: root
  loop: "{{ pam_files.files }}"
  loop_control:
    label: "{{ item.path }}"
