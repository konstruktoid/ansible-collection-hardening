---
- name: Verify
  hosts: all
  any_errors_fatal: true
  tasks:
    - name: Reboot and reconnect
      when:
        - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
      block:
        - name: Reboot host
          become: true
          ansible.builtin.reboot:

        - name: Wait for the host and reconnect
          ansible.builtin.wait_for:
            port: 22
            host: "{{ (ansible_facts.ssh_host | default(ansible_facts.host)) | default(inventory_hostname) }}"
            delay: 10
            timeout: 120

    - name: Include default vars
      ansible.builtin.include_vars:
        dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/"
        extensions:
          - yml

    - name: Include host vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/host_vars/{{ ansible_facts.hostname }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check whether timedatectl has NTP enabled
      ansible.builtin.command: timedatectl show --property=NTP --value
      register: timedatectl_ntp
      changed_when: false

    - name: Read timesyncd configuration
      ansible.builtin.slurp:
        src: /etc/systemd/timesyncd.conf
      register: timesyncd_conf

    - name: Assert timesyncd is configured and active
      ansible.builtin.assert:
        that:
          - "'systemd-timesyncd.service' in ansible_facts.services"
          - ansible_facts.services['systemd-timesyncd.service'].status == 'enabled'
          - ansible_facts.services['systemd-timesyncd.service'].state == 'running'
          - timedatectl_ntp.stdout | trim == 'yes'
          - >-
            (timesyncd_conf.content | b64decode) is search(
            '(?m)^NTP={{ (timesyncd_ntp_servers | default([])) | join(" ") | regex_escape }}$')
          - >-
            (timesyncd_conf.content | b64decode) is search(
            '(?m)^FallbackNTP={{ (timesyncd_fallback_ntp_servers | default([])) | join(" ") | regex_escape }}$')
        fail_msg: >-
          timesyncd verification failed: expected systemd-timesyncd to be enabled and
          running, timedatectl to report NTP=yes, and /etc/systemd/timesyncd.conf to
          contain the expected NTP/FallbackNTP values.
