---
- name: Install and configure systemd timesyncd
  become: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
  block:
    - name: Install epel-release for RHEL-based systems
      ansible.builtin.dnf:
        name: epel-release
        state: present
        update_cache: true
      when: ansible_facts.os_family == "RedHat"

    - name: Install systemd timesyncd
      ansible.builtin.package:
        name: systemd-timesyncd
        state: present

    - name: Configure systemd timesyncd
      ansible.builtin.template:
        src: "{{ timesyncd_conf_template }}"
        dest: /etc/systemd/timesyncd.conf
        backup: true
        mode: "0644"
        owner: root
        group: root
      notify:
        - Restart systemd-timesyncd

    - name: Gather service facts
      ansible.builtin.service_facts:

    # systemd-timedated picks the first unit listed in /usr/lib/systemd/ntp-units.d/ and
    # disables every other one, and chrony conflicts with systemd-timesyncd, so any other
    # time synchronization service left installed and enabled will win over timesyncd.
    - name: Stop conflicting time synchronization services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ timesyncd_conflicting_services }}"
      when:
        - item in ansible_facts.services
        - ansible_facts.services[item].state == "running"

    - name: Disable conflicting time synchronization services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop: "{{ timesyncd_conflicting_services }}"
      when:
        - item in ansible_facts.services
        - ansible_facts.services[item].status in ["enabled", "enabled-runtime"]

    - name: Start timesyncd
      ansible.builtin.systemd_service:
        name: systemd-timesyncd
        enabled: true
        masked: false
        state: started
