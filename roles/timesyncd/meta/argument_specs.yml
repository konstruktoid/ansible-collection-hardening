---
argument_specs:
  main:
    short_description: "Timesyncd configuration."
    description:
      - "This role configures systemd timesyncd to use the specified NTP servers for time synchronization."
      - "Any other time synchronization service is stopped and disabled, so that systemd-timesyncd is the only one running."
    author:
      - "Thomas Sjögren (@konstruktoid)"
    options:
      timesyncd_conf_template:
        description: "systemd timesyncd.conf template location."
        type: "path"
        default: "etc/systemd/timesyncd.conf.j2"
      timesyncd_conflicting_services:
        description:
          - "Services that also synchronize the system clock."
          - "They are stopped and disabled so that systemd-timesyncd is the only time synchronization service on the host."
        type: "list"
        elements: "str"
        default:
          - "chrony.service"
          - "chronyd-restricted.service"
          - "chronyd.service"
          - "ntp.service"
          - "ntpd-rs.service"
          - "ntpd.service"
          - "ntpsec.service"
          - "openntpd.service"
      fallback_ntp:
        description: "A list of NTP server host names or IP addresses to be used as the fallback NTP servers."
        type: "list"
        elements: "str"
        default:
          - "ntp.netnod.se"
          - "ntp.ubuntu.com"
      ntp:
        description: "A list of NTP server host names or IP addresses to be used as the primary NTP servers."
        type: "list"
        elements: "str"
        default:
          - "2.pool.ntp.org"
          - "time.nist.gov"
