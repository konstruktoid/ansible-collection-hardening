---
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]

- name: Restart systemd-timesyncd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
  when:
    - ansible_facts.virtualization_type not in ["container", "docker", "podman"]
